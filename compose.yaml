version: '3.8'

services:
  mysql_db:
    image: mysql:8.0
    container_name: water_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: water_iot_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  go_api:
    build: ./api-go
    container_name: water_go_api
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysql_db
    depends_on:
      - mysql_db

  go_stream:
    build: ./stream-data
    container_name: water_go_stream
    ports:
      - "7672:7672"
    depends_on:
      - mysql_db

  python_etl:
    build: ./etl-python
    container_name: water_python_etl
    environment:
      - DB_HOST=mysql_db
    depends_on:
      - mysql_db

volumes:
  mysql_data: