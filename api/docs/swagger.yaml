basePath: /
definitions:
  entities.TDMAZone:
    properties:
      billed_consumption:
        description: ปริมาณน้ำที่ขายได้ (ลบ.ม./วัน)
        type: number
      branch_name:
        description: 'สาขา (ตาม TOR: นำร่อง 4 สาขา)'
        type: string
      created_at:
        type: string
      customer_count:
        description: จำนวนผู้ใช้น้ำในโซน
        type: integer
      dma_code:
        description: รหัส DMA เช่น DMA-01
        type: string
      dma_name:
        description: ชื่อโซน เช่น โซนเทศบาล 1
        type: string
      id:
        type: integer
      nrw_ratio:
        description: อัตราน้ำสูญเสีย % (Non-Revenue Water)
        type: number
      region_code:
        description: 'เขต (ตาม TOR: 10 เขต)'
        type: string
      status:
        description: NORMAL, WARNING, CRITICAL (ตามเกณฑ์แจ้งเตือน)
        type: string
      target_pressure:
        description: แรงดันเป้าหมาย (bar) เช่น 2.5 (แนะนำ float64 เพื่อใช้เทียบกับ
          IoT)
        type: number
      total_inflow:
        description: ปริมาณน้ำจ่ายเข้าโซน (ลบ.ม./วัน)
        type: number
      updated_at:
        type: string
    type: object
  entities.WaterDataReq:
    properties:
      block:
        type: string
      flow_rate:
        type: number
      latitude:
        type: number
      leakage_flag:
        type: integer
      location_code:
        type: string
      longitude:
        type: number
      operational_hours:
        type: integer
      pipe:
        type: string
      pressure:
        type: number
      rpm:
        type: number
      temperature:
        type: number
      timestamp:
        type: integer
      vibration:
        type: number
      zone:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API documentation for Water IoT System
  title: Water IoT API
  version: "1.0"
paths:
  /api/v1/dma-zone:
    get:
      description: ดึงรายการพื้นที่จ่ายน้ำย่อย (DMA Zones) พร้อมรองรับ Pagination
      parameters:
      - default: 1
        description: เลขหน้า (Page number)
        in: query
        name: page
        type: integer
      - default: 10
        description: จำนวนรายการต่อหน้า (Items per page)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get DMA Zones
      tags:
      - DMA Zone
    post:
      consumes:
      - application/json
      description: เพิ่มข้อมูล DMA Zone
      parameters:
      - description: DMA Zone Data Payload
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/entities.TDMAZone'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create DMA Zone
      tags:
      - DMA Zone
  /api/v1/dma-zone/{id}:
    delete:
      description: ลบข้อมูลพื้นที่จ่ายน้ำย่อย (DMA Zone) ตาม ID
      parameters:
      - description: DMA Zone ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Delete DMA Zone By ID
      tags:
      - DMA Zone
    get:
      description: ดึงรายการพื้นที่จ่ายน้ำย่อย (DMA Zones) โดยเลือกข้อมูลจาก ID
      parameters:
      - description: DMA Zone ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get DMA Zone By ID
      tags:
      - DMA Zone
    put:
      consumes:
      - application/json
      description: แก้ไขข้อมูลพื้นที่จ่ายน้ำย่อย (DMA Zone) ตาม ID
      parameters:
      - description: DMA Zone ID
        in: path
        name: id
        required: true
        type: integer
      - description: DMA Zone Data Payload
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/entities.TDMAZone'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Update DMA Zone By ID
      tags:
      - DMA Zone
  /api/v1/sse-water-data/telemetry:
    get:
      description: เปิดการเชื่อมต่อ Server-Sent Events เพื่อรับข้อมูลเซ็นเซอร์ IoT
        แบบสดๆ
      produces:
      - text/event-stream
      responses: {}
      summary: Stream Real-time Telemetry (SSE)
      tags:
      - SSE
  /api/v1/water-data/telemetry:
    get:
      description: ดึงข้อมูล Telemetry ทั้งหมดล่าสุด
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get Latest Telemetry Data
      tags:
      - Water Data
    post:
      consumes:
      - application/json
      description: บันทึกข้อมูล Telemetry จากเซ็นเซอร์ IoT
      parameters:
      - description: Telemetry Data Payload
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/entities.WaterDataReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Save Telemetry Data
      tags:
      - Water Data
swagger: "2.0"
