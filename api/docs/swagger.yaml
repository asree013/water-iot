        in: query
        name: page
        type: integer
      - default: 10
        description: จำนวนรายการต่อหน้า (Items per page)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get DMA Zones
      tags:
      - DMA Zone
    post:
      consumes:
      - application/json
      description: เพิ่มข้อมูล DMA Zone
