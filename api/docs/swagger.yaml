  /api/v1/forecast/demand/{dma_code}:
    get:
      description: ดึงผลการพยากรณ์ความต้องการใช้น้ำล่วงหน้า 24 ชม. หรือ 7 วัน พร้อมช่วงความเชื่อมั่น
        80% (80% Confidence Interval) และคำแนะนำการสูบน้ำ Peak/Off-Peak ตามเกณฑ์ TOR
        ภาคผนวก ๔
      parameters:
      - description: รหัสโซน DMA เช่น DMA-SK-01, DMA-PB-01, DMA-KN-01, DMA-BKK-01
        in: path
        name: dma_code
        required: true
        type: string
      - default: 24h
        description: 'ช่วงเวลาพยากรณ์: ''24h'' (24 ชม. ล่วงหน้า) หรือ ''7d'' (7 วันล่วงหน้า)'
        in: query
        name: range
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get Water Demand Forecast
      tags:
      - Forecast
  /api/v1/forecast/metrics:
    get:
      description: ดึงผลการประเมินความแม่นยำของโมเดล Machine Learning Demand Forecasting
        (R2, Accuracy %, RMSE, MAE) เทียบกับเกณฑ์ TOR (ความแม่นยำ >= 85%) สามารถระบุ
        dma_code เพื่อดูเฉพาะโซน หรือเว้นว่างเพื่อดูภาพรวมทุกโซน
      parameters:
      - description: รหัสโซน DMA เช่น DMA-03, DMA-SK-01 (หากไม่ระบุจะแสดงภาพรวมและแจกแจงทุกโซน)
        in: query
        name: dma_code
        type: string
